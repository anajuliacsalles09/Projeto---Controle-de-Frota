<!DOCTYPE html>
<html>
<head>
    <title>Lista de Cargas</title>
</head>
<body>

    <h1>Lista de Cargas</h1>

    <a href="{% url 'carga_create' %}">
        Criar nova carga
    </a>

    <hr>

    {% for objeto in objetos %}

        <h2>Carga {{ objeto.id }}</h2>

        <p>
            <strong>Descrição:</strong>
            {{ objeto.descricao }}
        </p>

        <p>
            <strong>Peso:</strong>
            {{ objeto.peso }}
        </p>

        <p>
            <strong>Valor:</strong>
            {{ objeto.valor }}
        </p>

        <a href="{% url 'carga_detail' objeto.pk %}">
            Ver detalhes
        </a>

        |

        <a href="{% url 'carga_update' objeto.pk %}">
            Editar
        </a>

        |

        <a href="{% url 'carga_delete' objeto.pk %}">
            Excluir
        </a>

        <hr>

    {% empty %}

        <p>Nenhuma carga cadastrada.</p>

    {% endfor %}

</body>
</html>
