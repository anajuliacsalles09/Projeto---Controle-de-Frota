
{% extends 'base.html' %}

{% block title %}Excluir Abastecimento | Controle de Frota{% endblock %}

{% block content %}

<div class="page-title">
    <div class="title_left">
        <h3>Excluir Abastecimento</h3>
    </div>
</div>

<div class="clearfix"></div>

<div class="row">
    <div class="col-md-12 col-sm-12">

        <div class="x_panel">

            <div class="x_title">
                <h2>Confirmar exclusão</h2>
                <div class="clearfix"></div>
            </div>

            <div class="x_content">

                <p>Tem certeza que deseja excluir o abastecimento {{ objeto.id }}?</p>

                <form method="POST">
                    {% csrf_token %}

                    <button type="submit" class="btn btn-danger">
                        <i class="fa fa-trash"></i> Excluir
                    </button>

                    <a href="{% url 'abastecimento_list' %}" class="btn btn-primary">
                        <i class="fa fa-arrow-left"></i> Cancelar
                    </a>

                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
