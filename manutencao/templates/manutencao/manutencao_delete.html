<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Excluir Manutenção</title>
</head>
<body>

    <h1>Excluir Manutenção</h1>

    <p>
        Tem certeza que deseja excluir esta manutenção?
    </p>

    <p>
        <strong>Veículo:</strong>
        {{ objeto.veiculo }}
        <br>

        <strong>Tipo:</strong>
        {{ objeto.tipo }}
        <br>

        <strong>Descrição:</strong>
        {{ objeto.descricao }}
        <br>

        <strong>Data:</strong>
        {{ objeto.data }}
        <br>

        <strong>Valor:</strong>
        {{ objeto.valor }}
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Sim, excluir
        </button>

    </form>

    <br>

    <a href="{% url 'manutencao_detail' objeto.pk %}">
        Cancelar
    </a>

</body>
</html>
