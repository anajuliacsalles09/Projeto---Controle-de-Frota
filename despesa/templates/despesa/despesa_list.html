<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Despesas</title>
</head>
<body>

    <h1>Despesas cadastradas</h1>

    <a href="{% url 'despesa_create' %}">Cadastrar nova despesa</a>

    <hr>

    {% for despesa in objetos %}

        <div>
            <p><strong>Viagem:</strong> {{ despesa.viagem }}</p>
            <p><strong>Tipo:</strong> {{ despesa.tipo }}</p>
            <p><strong>Descrição:</strong> {{ despesa.descricao }}</p>
            <p><strong>Valor:</strong> {{ despesa.valor }}</p>
            <p><strong>Data:</strong> {{ despesa.data }}</p>
        </div>

        <hr>

    {% empty %}

        <p>Nenhuma despesa cadastrada.</p>

    {% endfor %}

</body>
</html>
