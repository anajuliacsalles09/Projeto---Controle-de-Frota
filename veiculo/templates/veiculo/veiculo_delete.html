<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Excluir Veículo</title>
</head>

<body>

    <h1>Excluir Veículo</h1>

    <p>
        Tem certeza que deseja excluir o veículo
        {{ veiculo.placa }}?
    </p>

    <form method="post">

        {% csrf_token %}

        <button type="submit">Sim, excluir</button>

    </form>

    <br>

    <a href="{% url 'veiculo_detail' veiculo.id %}">
        Cancelar
    </a>

</body>

</html>
