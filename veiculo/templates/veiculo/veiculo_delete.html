
{% extends 'base.html' %}

{% block title %}Excluir Veículo | Controle de Frota{% endblock %}

{% block content %}

<div class="page-title">
    <div class="title_left">
        <h3>Excluir Veículo</h3>
    </div>
</div>

<div class="clearfix"></div>

<div class="row">
    <div class="col-md-12">

        <div class="x_panel">

            <div class="x_title">
                <h2>Confirmar exclusão</h2>
                <div class="clearfix"></div>
            </div>

            <div class="x_content">

                <p>Tem certeza que deseja excluir o veículo {{ objeto.placa }}?</p>

                <form method="POST">
                    {% csrf_token %}

                    <button type="submit" class="btn btn-danger">
                        Excluir
                    </button>

                    <a href="{% url 'veiculo_list' %}" class="btn btn-primary">
                        Cancelar
                    </a>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
