<!DOCTYPE html>
<html>
<head>
    <title>Excluir Viagem</title>
</head>
<body>

    <h1>Excluir Viagem</h1>

    <p>
        Tem certeza que deseja excluir esta viagem?
    </p>

    <p>
        <strong>Origem:</strong> {{ objeto.origem }}
        <br>
        <strong>Destino:</strong> {{ objeto.destino }}
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Sim, excluir
        </button>

    </form>

    <br>

    <a href="{% url 'viagem_detail' objeto.pk %}">
        Cancelar
    </a>

</body>
</html>
