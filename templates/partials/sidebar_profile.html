<section class="sidebar-account" aria-label="Sua conta">
    <button type="button" class="sidebar-account-toggle" data-toggle="collapse"
            data-target="#sidebar-account-details" aria-expanded="false"
            aria-controls="sidebar-account-details" title="Informações da conta">
        <span class="sidebar-account-avatar" aria-hidden="true">{{ user.usuario.nome|default:user.username|first|upper }}</span>
        <span class="sidebar-account-name">
            <strong>{{ user.usuario.nome|default:user.username }}</strong>
            <small>{% if user.is_superuser or user.usuario.tipo == 'ADMIN' %}Administrador{% else %}Funcionário{% endif %}</small>
        </span>
        <i class="fa fa-angle-down sidebar-account-arrow" aria-hidden="true"></i>
    </button>
    <div id="sidebar-account-details" class="collapse sidebar-account-details">
        <span>Usuário</span>
        <strong>{{ user.username }}</strong>
        <span>E-mail</span>
        <strong>{{ user.email|default:"Não informado" }}</strong>
    </div>
    <form method="post" action="{% url 'logout' %}" class="sidebar-account-logout">
        {% csrf_token %}
        <button type="submit" title="Sair da conta">
            <i class="fa fa-sign-out" aria-hidden="true"></i>
            <span>Sair da conta</span>
        </button>
    </form>
</section>
