<header class="top_nav{% if not user.is_authenticated and not public_dashboard %} public-header{% endif %}">
    <div class="nav_menu site-topbar">
        <div class="site-topbar-brand">
            {% if user.is_authenticated or public_dashboard %}
            <button type="button" id="menu_toggle" class="site-menu-toggle"
                    aria-label="Expandir ou recolher menu lateral" aria-controls="sidebar-menu">
                <i class="fa fa-bars" aria-hidden="true"></i>
            </button>
            <span class="site-topbar-label">Gestão da frota</span>
            {% else %}
            <a href="{% url 'dashboard' %}" class="site-public-brand">
                <i class="fa fa-truck" aria-hidden="true"></i> Controle de Frota
            </a>
            {% endif %}
        </div>
        <nav class="site-auth-actions" aria-label="Acesso à conta">
            {% if not user.is_authenticated %}
            <a href="{% url 'login' %}" class="site-auth-button site-auth-login">Entrar</a>
            <a href="{% url 'usuario_register' %}" class="site-auth-button site-auth-register">Cadastrar</a>
            {% elif perms.usuario.add_usuario %}
            <a href="{% url 'usuario_create' %}" class="site-auth-button site-auth-register">
                <i class="fa fa-plus" aria-hidden="true"></i> Cadastrar
            </a>
            {% endif %}
        </nav>
    </div>
</header>
